# vim:fileencoding=utf-8:foldmethod=marker

# BEGIN_KITTY_THEME
# Adwaita dark
include current-theme.conf
# END_KITTY_THEME

# BEGIN_KITTY_FONTS
font_family      family='Monaco' variable_name=ChivoMono wght=350 features='-liga -calt +tnum +zero'
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

font_features                none
font_size 12.0
modify_font baseline         2
modify_font cell_height      82%
modify_font cell_width       95%

hide_window_decorations      no
macos_colorspace             displayp3
macos_option_as_alt          yes
macos_titlebar_color         background
macos_show_window_title_in   all
window_padding_width         4

allow_remote_control         yes
shell_integration            no-cursor
active_tab_font_style        bold
cursor_blinking_interval     0
cursor_shape                 beam
cursor_trail                 1
cursor_trail_decay           0.1 0.3
cursor_trail_start_threshold 2

# simple tab bar
# tab_bar_align                left
# tab_bar_edge                 bottom
# tab_bar_margin_height        0 7.5
# tab_bar_style                slant
# tab_powerline_style          slanted

# custom tab bar
active_tab_background       #36a3d9
active_tab_foreground       #0e1419
inactive_tab_background     #0e1419
tab_bar_style               custom
tab_separator               slanted
tab_title_template          "|{bell_symbol or activity_symbol} ⌘{index}| |{title}"
active_tab_title_template   "|{' ' if layout_name == 'stack' else ''}{bell_symbol} ⌘{index}| |{title}"
tab_bar_min_tabs            1
tab_activity_symbol         ""
bell_on_tab                 "󱐋"
tab_bar_margin_height       0.0 2.0

map cmd+t           new_tab_with_cwd !neighbor
map cmd+shift+t     new_tab
map cmd+w           close_tab
map cmd+]           next_tab
map cmd+[           previous_tab
map cmd+1           goto_tab 1
map cmd+2           goto_tab 2
map cmd+3           goto_tab 3
map cmd+4           goto_tab 4
map cmd+5           goto_tab 5
map cmd+6           goto_tab 6
map cmd+7           goto_tab 7
map cmd+8           goto_tab 8
map cmd+9           goto_tab 9
map cmd+10          goto_tab 10

map cmd+enter       new_window

map opt+left        send_text all \x1b\x62
map opt+right       send_text all \x1b\x66
map super+left      send_text all \x01 
map super+right     send_text all \x05
map super+backspace send_text all \x15

map cmd+f           launch --type=overlay --stdin-source=@screen_scrollback /opt/homebrew/bin/fzf --no-sort --no-mouse --exact -i --tac
